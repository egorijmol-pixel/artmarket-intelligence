name: ArtMarket RSS and evidence triage

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artmarket-updates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Load repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Find sale leads from public RSS feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          DATA = Path('data')
          DATA.mkdir(exist_ok=True)
          UTC = dt.timezone.utc
          NOW = dt.datetime.now(UTC).isoformat()
          # Only public feeds; posts are unverified leads, not confirmed transactions.
          SEARCHES = [
              'auction "sold for" "million"',
              'collectible auction "sells for"',
              'auction "achieves" "$"',
              'private sale art collectible "million"',
              'vintage car auction "sold for"',
              'rare coin auction "sold"',
              'jewelry diamond auction "sold for"',
              'sports card collectible auction "sold for"',
              'comic book auction "sold for"',
              'watch auction "sold for" million',
          ]
          # Bonhams RSS returned HTTP 403: do not request a blocked feed.
          FEEDS = []
          for term in SEARCHES:
              q = urllib.parse.urlencode({'q': term, 'hl': 'en-US', 'gl': 'US', 'ceid': 'US:en'})
              FEEDS.append(('Google News: ' + term, 'https://news.google.com/rss/search?' + q))

          USD = re.compile(r'(?:US\s*)?\$\s*(\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?)\s*(billion|million|thousand|bn|m|k)?\b', re.I)
          SOLD = re.compile(r'\b(sold|sells|selling for|achieved|achieves|realized|realised|fetched|fetches|hammered|auction record|sale results?)\b', re.I)
          PRESALE = re.compile(r'\b(expected to|estimate(?:d)?|hopes? to|could fetch|may fetch|pre-sale|to be sold)\b', re.I)
          TOTAL = re.compile(r'\b(sale total|auction total|overall total|combined total|total sales|auction achieves|sales totaled)\b', re.I)


          def strip(s):
              return html.unescape(re.sub(r'<[^>]*>', ' ', s or '')).replace('\n', ' ').strip()[:600]


          def price_values(s):
              result = []
              for m in USD.finditer(s):
                  try:
                      value = float(m.group(1).replace(',', ''))
                      unit = (m.group(2) or '').lower()
                      value *= {'billion': 1e9, 'bn': 1e9, 'million': 1e6, 'm': 1e6, 'thousand': 1e3, 'k': 1e3}.get(unit, 1)
                      if value >= 300000:
                          result.append(round(value))
                  except (ValueError, OverflowError):
                      pass
              return result


          def classify(s):
              s = s.lower()
              tags = [
                  ('watch', ['watch', 'patek', 'rolex', 'timepiece', 'journe']),
                  ('cars', ['car ', 'ferrari', 'porsche', 'automobile', 'bugatti']),
                  ('jewelry', ['diamond', 'jewel', 'ruby', 'sapphire']),
                  ('coins', ['coin', 'numismatic', 'banknote']),
                  ('wine', ['wine', 'whisky', 'whiskey']),
                  ('books', ['book', 'manuscript', 'first edition']),
                  ('art', ['painting', 'artist', 'picasso', 'warhol', 'monet', 'canvas']),
              ]
              return next((k for k, terms in tags if any(t in s for t in terms)), 'other')


          def timestamp(s):
              if not s:
                  return ''
              try:
                  return parsedate_to_datetime(s).astimezone(UTC).isoformat()
              except (ValueError, TypeError, OverflowError):
                  try:
                      return dt.datetime.fromisoformat(s.replace('Z', '+00:00')).astimezone(UTC).isoformat()
                  except (ValueError, TypeError):
                      return ''


          def node_text(node, name):
              x = node.find(name)
              return (x.text or '').strip() if x is not None else ''


          def entries(content):
              root = ET.fromstring(content)
              result = []
              if root.find('channel') is not None:
                  for i in root.findall('./channel/item')[:100]:
                      origin = i.find('source')
                      result.append((node_text(i, 'title'), node_text(i, 'description'), node_text(i, 'link'), timestamp(node_text(i, 'pubDate')), (origin.text or '').strip() if origin is not None else '', (origin.get('url') or '') if origin is not None else ''))
              else:
                  ns = '{http://www.w3.org/2005/Atom}'
                  for i in root.findall('.//' + ns + 'entry')[:100]:
                      link = next((a.get('href', '') for a in i.findall(ns + 'link') if a.get('rel', 'alternate') == 'alternate'), '')
                      result.append((node_text(i, ns + 'title'), node_text(i, ns + 'summary'), link, timestamp(node_text(i, ns + 'published') or node_text(i, ns + 'updated')), '', ''))
              return result


          def load(name, default):
              try:
                  return json.loads((DATA / name).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default


          def store(name, value):
              (DATA / name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')


          current = load('candidates.json', [])
          if not isinstance(current, list):
              current = []
          found = {x['id']: x for x in current if isinstance(x, dict) and 'id' in x}
          checks = []
          for label, url in FEEDS:
              count = 0
              seen = 0
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'ArtMarketIntelligence/4.1 personal RSS reader', 'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml'})
                  with urllib.request.urlopen(req, timeout=16) as response:
                      if response.status != 200:
                          raise ValueError('HTTP ' + str(response.status))
                      raw = response.read(2_000_001)
                  if len(raw) > 2_000_000:
                      raise ValueError('RSS larger than 2 MB')
                  posts = entries(raw)
                  seen = len(posts)
                  for title, desc, link, published, publisher_name, publisher_url in posts:
                      title, desc = strip(title), strip(desc)
                      if not link.startswith('https://'):
                          continue
                      if not SOLD.search(title + ' ' + desc) or PRESALE.search(title):
                          continue
                      if TOTAL.search(title) and not re.search(r'\b(lot|watch|painting|car|diamond|ring|artwork|computer)\b', title, re.I):
                          continue
                      values = price_values(title) or price_values(desc)
                      if not values:
                          continue
                      key = hashlib.sha256(link.encode('utf-8')).hexdigest()[:16]
                      if key in found:
                          continue
                      found[key] = {'id': key, 'title': title, 'summary': desc[:350], 'url': link,
                                    'published_at': published, 'indicative_usd': max(values),
                                    'category_hint': classify(title + ' ' + desc),
                                    'source_name': label, 'publisher_name': publisher_name, 'publisher_url': publisher_url, 'status': 'candidate',
                                    'note': 'Сообщение требует проверки. Цена, тип сделки и дата продажи не установлены.'}
                      count += 1
                  checks.append({'name': label, 'status': 'ok', 'articles_seen': seen, 'new_candidates': count})
              except Exception as e:
                  checks.append({'name': label, 'status': 'error', 'reason': str(e)[:160]})

          items = sorted(found.values(), key=lambda x: (x.get('published_at') or '', x.get('id') or ''), reverse=True)[:500]
          store('candidates.json', items)
          if not (DATA / 'records.json').exists():
              store('records.json', [])
          status = {'last_attempt_utc': NOW, 'sources_checked': len(checks),
                    'sources_ok': sum(x['status'] == 'ok' for x in checks),
                    'candidates_count': len(items), 'verified_automatic': 0,
                    'checks': checks,
                    'notice': 'RSS-публикации являются кандидатами, не подтверждёнными продажами.'}
          store('status.json', status)
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Prepare review queue and suspected duplicate groups
        shell: bash
        run: |
          python3 - <<'PY'
          """Local, standard-library-only RSS candidate triage for ArtMarket Intelligence.
          
          This code does NOT verify auctions or turn RSS headlines into verified sales.
          It groups likely duplicates and creates an evidence-review queue, to avoid
          counting repeated press coverage as multiple lots.
          """
          from __future__ import annotations
          
          import datetime as dt
          import hashlib
          import json
          import re
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlparse
          
          DATA = Path('data')
          NOW = dt.datetime.now(dt.timezone.utc)
          BASE = {
              'auction', 'auctions', 'sold', 'sells', 'sale', 'record', 'fetches', 'fetched',
              'reaches', 'achieves', 'achieved', 'for', 'million', 'millions', 'nearly',
              'about', 'more', 'than', 'over', 'the', 'and', 'with', 'from', 'this', 'that',
              'year', 'its', 'his', 'her', 'lot', 'news', 'worth', 'price', 'world',
              'highest', 'ever', 'historic', 'at', 'by', 'as', 'in', 'of', 'a', 'an',
              'is', 'it', 'to', 'on', 'up', 'us', 'usd', 'new', 'up', 'first',
              'christies', 'sothebys', 'phillips', 'bonhams', 'heritage', 'billion',
              'млн', 'продан', 'торги', 'аукцион', 'миллионов', 'долларов', 'за', 'и',
          }
          PRICE = re.compile(r"(?<!\w)(?:\$\s*)?\d+(?:[,.]\d+)*(?:\s*(?:million|billion|thousand|millions|m|bn|k))?\b", re.I)
          PUBLISHER_TAIL = re.compile(r"\s+[-–—]\s+[^\-–—]{2,65}$")
          AGGREGATE = re.compile(r"\b(?:auction total|sale total|total sales|combined sales|grossed|auction achieves|auction house reports|auction brings|sales reach|totaled)\b", re.I)
          PRESALE = re.compile(r"\b(?:estimate|estimated|expected to|could fetch|may fetch|pre.sale|will sell|upcoming)\b", re.I)
          REVIEW_LIMIT = 800
          
          
          def words(title):
              t = PUBLISHER_TAIL.sub('', title or '')
              t = unicodedata.normalize('NFKD', t).lower()
              t = ''.join(c for c in t if not unicodedata.combining(c))
              t = PRICE.sub(' ', t)
              t = re.sub(r"[^a-zа-яё0-9]+", ' ', t, flags=re.I)
              out = {w for w in t.split() if len(w) > 2 and w not in BASE and not w.isdigit()}
              return out
          
          
          def clean_text(s, maxlen=300):
              return re.sub(r'\s+', ' ', str(s or '')).strip()[:maxlen]
          
          
          def norm_url(u):
              if not isinstance(u, str) or len(u) > 2048:
                  return ''
              try:
                  p = urlparse(u)
                  if p.scheme != 'https' or not p.hostname:
                      return ''
                  return u
              except ValueError:
                  return ''
          
          
          def date_of(item):
              try:
                  d = dt.datetime.fromisoformat(str(item.get('published_at','')).replace('Z','+00:00'))
                  if d.tzinfo is None:
                      return None
                  return d.astimezone(dt.timezone.utc)
              except (ValueError, TypeError):
                  return None
          
          
          def norm_price(item):
              try:
                  p = float(item.get('indicative_usd') or 0)
                  return round(p) if p >= 300000 and p < 1e12 else 0
              except (ValueError, TypeError, OverflowError):
                  return 0
          
          
          def compatible(a, b):
              ta = a['_words']; tb = b['_words']
              if len(ta) < 2 or len(tb) < 2:
                  return False
              common = len(ta & tb)
              if common < 2:
                  return False
              jaccard = common / len(ta | tb)
              containment = common / min(len(ta), len(tb))
              if jaccard < 0.52 and containment < 0.72:
                  return False
              if a.get('category_hint') != b.get('category_hint') and 'other' not in (a.get('category_hint'),b.get('category_hint')):
                  return False
              pa, pb = norm_price(a), norm_price(b)
              if not pa or not pb or abs(pa-pb)/max(pa,pb) > 0.18:
                  return False
              da, db = date_of(a), date_of(b)
              if da and db and abs((da-db).days) > 45:
                  return False
              return True
          
          
          def sanitize(item):
              if not isinstance(item, dict):
                  return None
              title = clean_text(item.get('title'), 300)
              url = norm_url(item.get('url'))
              if not title or not url or norm_price(item) < 300000:
                  return None
              # ID uniquely anchors original news article, NOT an auction transaction.
              key = clean_text(item.get('id'), 64) or hashlib.sha256(url.encode()).hexdigest()[:20]
              return {
                  'id': key, 'title': title, 'url': url,
                  'source_name': clean_text(item.get('source_name'), 130),
                  'published_at': clean_text(item.get('published_at'), 50),
                  'indicative_usd': norm_price(item),
                  'category_hint': clean_text(item.get('category_hint'), 40) or 'other',
                  'publisher_name': clean_text(item.get('publisher_name'), 100) or clean_text((PUBLISHER_TAIL.search(title).group(0) if PUBLISHER_TAIL.search(title) else '').strip(' -–—'), 100),
                  'publisher_url': norm_url(item.get('publisher_url')),
                  '_words': words(title),
              }
          
          
          def groups_from(items):
              clean=[]; seen=set()
              for item in items:
                  x = sanitize(item)
                  if not x or x['id'] in seen:
                      continue
                  seen.add(x['id']); clean.append(x)
              clean.sort(key=lambda x: (x['published_at'],x['id']), reverse=True)
              groups=[]
              for x in clean[:REVIEW_LIMIT]:
                  # Compare to existing group only using headline similarity; no transitive overmerging.
                  matching = next((g for g in groups if compatible(x, g[0])), None)
                  if matching is None:
                      groups.append([x])
                  else:
                      matching.append(x)
              output=[]
              for g in groups:
                  main=g[0]
                  vals=sorted(set(norm_price(x) for x in g))
                  percent=round(100*(max(vals)-min(vals))/max(vals), 1) if vals else 0
                  title=main['title']
                  pubs={str(x.get('publisher_name') or x.get('source_name') or '').strip().lower() for x in g}
                  pubs.discard('')
                  flags=['Не найден проверенный результат конкретного лота из официального источника']
                  if percent>4:
                      flags.append('Различающиеся суммы из публикаций — проверить округление и комиссию')
                  if AGGREGATE.search(title):
                      flags.append('Возможный общий итог аукциона, не цена одного предмета')
                  if PRESALE.search(title):
                      flags.append('Возможная предварительная оценка, не подтвержденная продажа')
                  if not any(x['publisher_url'] for x in g):
                      flags.append('Не указан адрес оригинального издателя')
                  priority = 2 if len(pubs)>1 else 1
                  if AGGREGATE.search(title) or PRESALE.search(title):
                      priority=0
                  urls = [{'candidate_id': x['id'], 'title': x['title'], 'url': x['url'], 'publisher_name':x['publisher_name'], 'publisher_url':x['publisher_url'], 'published_at':x['published_at'], 'indicative_usd':x['indicative_usd']} for x in g[:20]]
                  output.append({
                      'group_id': hashlib.sha256('|'.join(sorted(x['id'] for x in g)).encode()).hexdigest()[:16],
                      'title':title, 'category_hint': main['category_hint'],
                      'articles': len(g), 'publishers': len(pubs),
                      'indicative_usd_values': vals, 'amount_variation_pct': percent,
                      'last_publication_at': main['published_at'], 'priority':priority,
                      'checks_needed': flags,
                      'decision':'needs_official_primary_source',
                      'is_verified_sale':False,
                      'candidate_ids':[x['id'] for x in g],
                      'links':urls,
                  })
              output.sort(key=lambda x:(x['priority'],x['articles'],x['last_publication_at']),reverse=True)
              return clean, output
          
          
          def write_json(path, value):
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(json.dumps(value,ensure_ascii=False,indent=2) + '\n',encoding='utf-8')
          
          
          def build(data=DATA):
              try:
                  candidates = json.loads((data/'candidates.json').read_text(encoding='utf-8'))
                  if not isinstance(candidates,list): candidates=[]
              except (ValueError,OSError):
                  candidates=[]
              clean, groups=groups_from(candidates)
              summary={
                  'generated_at_utc':NOW.isoformat(),
                  'candidate_messages':len(clean),
                  'potential_sale_groups':len(groups),
                  'potential_repeats':len(clean)-len(groups),
                  'groups_with_multiple_publishers':sum(g['publishers']>1 for g in groups),
                  'groups_with_price_conflicts':sum(g['amount_variation_pct']>4 for g in groups),
                  'officially_verified_by_this_step':0,
                  'status':'triage_only',
                  'note':'Автоматическая группировка публикаций и поиск противоречий. Никакая группа не считается подтвержденной продажей без сверки официального результата конкретного лота.',
              }
              write_json(data/'review_queue.json',groups)
              write_json(data/'review_status.json',summary)
              print(json.dumps(summary,ensure_ascii=False,indent=2))
              return summary
          
          
                    if __name__ == '__main__':
              build()
          PY

      - name: Commit public data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update ArtMarket review data"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html public/
          cp -r data public/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
