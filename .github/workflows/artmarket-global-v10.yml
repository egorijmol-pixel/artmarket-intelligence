name: ArtMarket Global Auctions Discovery v10

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artmarket-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Load existing ArtMarket files
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Collect worldwide public RSS evidence, without fabricating sales
        shell: bash
        run: |
          python3 - <<'PY'
