          Leonard Joel|leonardjoel.com.au|AU|art,antiques|house|en
          Deutscher and Hackett|deutscherandhackett.com|AU|art|house|en
          Menzies Art Brands|menziesartbrands.com|AU|art|house|en
          Smith & Singer|smithandsinger.com.au|AU|art|house|en
          Shapiro Auctions|shapiro.com.au|AU|art|house|en
          Noble Numismatics|noble.com.au|AU|coins|house|en
          Webb's|webbs.co.nz|NZ|art|house|en
          Art+Object|artandobject.co.nz|NZ|art,antiques|house|en
          Dunbar Sloane|dunbarsloane.co.nz|NZ|art,antiques|house|en
          Morton Subastas|mortonsubastas.com|MX|art,antiques|house|es
          Bolsa de Arte|bolsadearte.com|BR|art|house|pt
          Tiroche|tiroche.co.il|IL|art|house|he
          Kedem|kedem-auctions.com|IL|books,collectibles|house|he
          Matsart|matsartauctioneers.com|IL|art|house|en
          Литфонд|litfund.ru|RU|books,art|house|ru
          Artinvestment|artinvestment.ru|RU|art|platform|ru
          Совком|sovcom.ru|RU|art|house|ru
          Монеты и медали|numismat.ru|RU|coins|house|ru
          Auction.ru|auction.ru|RU|all|platform|ru
          Bidspirit|bidspirit.com|Global|all|platform|en
          '''

          LANGUAGE = {
           'en': ('en-US','US','US:en','sold auction record realized brings fetched'),
           'fr': ('fr','FR','FR:fr','vendu enchères adjugé record'),
           'de': ('de','DE','DE:de','versteigert verkauft rekord auktion'),
           'it': ('it','IT','IT:it','venduto asta aggiudicato record'),
           'es': ('es','ES','ES:es','vendido subasta rematado récord'),
           'sv': ('sv','SE','SE:sv','såld auktion rekord'),
           'nl': ('nl','NL','NL:nl','verkocht veiling record'),
           'pl': ('pl','PL','PL:pl','sprzedano aukcja rekord'),
           'ru': ('ru','RU','RU:ru','продано аукцион рекорд'),
           'pt': ('pt-BR','BR','BR:pt-419','vendido leilão recorde'),
           'zh': ('zh-TW','TW','TW:zh-Hant','成交 拍賣 拍出'),
           'ko': ('ko','KR','KR:ko','낙찰 경매 판매'),
           'ja': ('ja','JP','JP:ja','落札 オークション 売却'),
           'he': ('en-US','US','US:en','sold auction record'),
          }
          SOLD = re.compile(r'\b(sold|sells|brought|brings|fetched|fetches|realized|realised|hammered|knocked down|achieved|vendu|vendue|adjugé|verkauft|versteigert|venduto|aggiudicato|vendido|rematado|sprzedan[oaey]|såld|verkocht|продан[оыа]?|продали|уш[её]л|leilão)\b|成交|拍出|落札|売却|낙찰', re.I)
          FUTURE = re.compile(r'\b(estimate|estimated|expects?|expected to|could fetch|may fetch|will fetch|to be offered|upcoming|pre.sale|asking price|for sale|offered for|could sell|preview)\b', re.I)
          AGGREGATE = re.compile(r'\b(auction total|sale total|overall|aggregate|total sales|total revenue|overall sales|auction proceeds|sales totaled|combined sales|collection totals?|total turnover|annual revenue)\b', re.I)
          NUM = r'(?P<n>\d{1,3}(?:[ ,.]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)'
          SUFFIX = r'\s*(?P<u>billion|million|thousand|bn|mn|m|k|млн|млрд|тыс)?\b'
          PATTERNS = [
           ('USD', re.compile(r'(?<![A-Za-z])(?:US\$|USD\s*|\$\s*)' + NUM + SUFFIX, re.I)),
           ('EUR', re.compile(r'(?:€|EUR\s*)\s*' + NUM + SUFFIX, re.I)),
           ('GBP', re.compile(r'(?:£|GBP\s*)\s*' + NUM + SUFFIX, re.I)),
           ('CHF', re.compile(r'CHF\s*' + NUM + SUFFIX, re.I)),
           ('HKD', re.compile(r'(?:HK\$|HKD\s*)\s*' + NUM + SUFFIX, re.I)),
           ('CNY', re.compile(r'(?:CNY\s*|RMB\s*|CN¥\s*)\s*' + NUM + SUFFIX, re.I)),
           ('JPY', re.compile(r'(?:JPY\s*|¥\s*)\s*' + NUM + SUFFIX, re.I)),
           ('AUD', re.compile(r'(?:AU\$|AUD\s*)\s*' + NUM + SUFFIX, re.I)),
           ('CAD', re.compile(r'(?:CA\$|CAD\s*)\s*' + NUM + SUFFIX, re.I)),
           ('RUB', re.compile(r'(?:₽|RUB\s*|руб(?:лей|ля|\.)?\s*)\s*' + NUM + SUFFIX, re.I)),
          ]
          MULTIPLIERS={'billion':1e9,'млрд':1e9,'bn':1e9,'million':1e6,'mn':1e6,'млн':1e6,'m':1e6,'thousand':1000,'тыс':1000,'k':1000}


          def parse_amount(title):
              hits=[]
              for code, pattern in PATTERNS:
                  for match in pattern.finditer(title):
                      number=match.group('n').replace(' ','')
                      # Basic EU decimal handling; anything ambiguous stays a review lead.
                      if ',' in number and '.' in number:
                          if number.rfind(',')>number.rfind('.'):
                              number=number.replace('.','').replace(',','.')
                          else:
                              number=number.replace(',','')
                      elif ',' in number:
                          if len(number.split(',')[-1])==3:
                              number=number.replace(',','')
                          else:
                              number=number.replace(',','.')
                      elif '.' in number and len(number.split('.')[-1])==3 and not match.group('u'):
                          number=number.replace('.','')
                      try:
                          value=round(float(number)*MULTIPLIERS.get((match.group('u') or '').lower(),1))
                      except (ValueError, OverflowError):
                          continue
                      if value>0:
                          hits.append((match.start(),value,code,match.group(0).strip()))
              if not hits: return None
              # The first amount is more likely the individual item than the auction total;
              # never use these candidates as a verified transaction without manual/primary proof.
              pos,value,currency,raw=sorted(hits,key=lambda a:a[0])[0]
              return {'currency':currency,'amount_native':value,'amount_text':raw,
                      'indicative_usd': value if currency=='USD' else None,
                      'multiple_amounts_in_headline':len(hits)>1}


          def sources():
              result=[]
              seen=set()
              for l in REGISTRY.splitlines():
                  l=l.strip()
                  if not l:continue
                  name,domain,country,category,role,language=l.split('|')
                  if domain in seen:raise ValueError('Duplicate domain: '+domain)
                  if not re.fullmatch(r'[a-z0-9-]+(?:\.[a-z0-9-]+)+',domain):raise ValueError('Invalid domain: '+domain)
                  if 'phillips' in domain.lower() or name.lower()=='phillips':raise ValueError('Excluded house in registry')
                  seen.add(domain)
                  result.append({'id':hashlib.sha256(domain.encode()).hexdigest()[:12], 'name':name,
                                 'domain':domain,'country':country,'category':category.split(','),
                                 'type':role,'language':language,'query_method':'Google News publisher-domain RSS',
                                 'coverage_status':'discovery_only_not_confirmed'})
              return result


          def load(name,default):
              try:return json.loads((ROOT/name).read_text(encoding='utf-8'))
              except (OSError,ValueError):return default


          def save(name,obj):
              (ROOT/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')


          def host(url):
              try:
                  p=urllib.parse.urlparse(url)
                  return (p.hostname or '').lower() if p.scheme=='https' else ''
              except ValueError:return ''


          def same_host(hostname,domain):
              return hostname==domain or hostname.endswith('.'+domain)


          def item_text(node,name):
              e=node.find(name)
              return (e.text or '').strip() if e is not None else ''


          def iso_date(s):
              from email.utils import parsedate_to_datetime
              try:return parsedate_to_datetime(s).astimezone(dt.timezone.utc).isoformat()
              except (ValueError,OverflowError,TypeError):return ''


          def kind(title,cat):
              s=title.lower()
              classifiers={
                 'coins':['coin','coins','numismatic','dime','denar','monnaie','монет','münze'],
                 'cars':['ferrari','porsche','lamborghini','mclaren','aston martin','car ','automobile','bmw'],
                 'watches':['patek','rolex','watch','timepiece','horloger','uhr'],
                 'books':['book','manuscript','first edition','rare book','комикс','comic'],
                 'jewelry':['diamond','sapphire','ruby','jewel','brilliant','brillant','бриллиант'],
                 'sports':['sports card','baseball','football jersey','michael jordan','sports memorabilia'],
                 'wine':['wine','whisky','whiskey','bourgogne','champagne','vintage wine'],
                 'art':['artwork','painting','picasso','warhol','sculpture','peinture','живопис','картина'],
              }
              return next((k for k,keys in classifiers.items() if any(w in s for w in keys)), cat[0] if cat and cat[0]!='all' else 'other')


          def news_feed(source):
              lang,gl,ceid,words=LANGUAGE.get(source['language'],LANGUAGE['en'])
              q='site:'+source['domain']+' ('+' OR '.join(words.split())+')'
              params=urllib.parse.urlencode({'q':q,'hl':lang,'gl':gl,'ceid':ceid})
              url='https://news.google.com/rss/search?'+params
              req=urllib.request.Request(url,headers={'User-Agent':'ArtMarketIntelligenceGlobal/10.0 (public RSS discovery)','Accept':'application/rss+xml, application/xml'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  buf=resp.read(1_750_001)
                  if len(buf)>1_750_000:raise ValueError('RSS exceeded 1.75 MB')
                  if resp.status!=200:raise ValueError('Unexpected HTTP '+str(resp.status))
              return ET.fromstring(buf).findall('./channel/item')[:80]


          def collect():
              registry=sources()
              save('global_sources.json', registry)
              state=load('global_scan_state.json',{'cursor':0,'cycles':0,'runs':0})
              if not isinstance(state,dict):state={'cursor':0,'cycles':0,'runs':0}
              cursor=int(state.get('cursor',0))%len(registry)
              existing=load('global_review.json',[])
              if not isinstance(existing,list):existing=[]
              byid={x['id']:x for x in existing if isinstance(x,dict) and x.get('id')}
              checked=[]
              added=0
              for offset in range(min(PER_RUN,len(registry))):
                  src=registry[(cursor+offset)%len(registry)]
                  stamp={'house':src['name'],'country':src['country'],'domain':src['domain']}
                  try:
                      docs=news_feed(src)
                      accepted=0
                      for node in docs:
                          source_el=node.find('source')
                          if source_el is None:continue
                          pub_url=source_el.get('url') or ''
                          if not same_host(host(pub_url),src['domain']):continue
                          title=html.unescape(item_text(node,'title'))[:320]
                          link=item_text(node,'link')
                          if host(link)!='news.google.com' or 'phillips' in title.lower():continue
                          if not SOLD.search(title) or FUTURE.search(title):continue
                          amount=parse_amount(title)
                          if amount is None:continue
                          if amount['indicative_usd'] is not None and amount['indicative_usd']<MIN_USD:continue
                          cid=hashlib.sha256((src['domain']+'|'+link).encode('utf8')).hexdigest()[:20]
                          if cid in byid:continue
                          aggregate=bool(AGGREGATE.search(title))
                          reason=['Требуется оригинальная страница с окончательной ценой конкретного лота',
                                  'Дата публикации не считается датой продажи',
                                  'Без официального результата запись не является подтверждённой']
                          if aggregate: reason.append('В заголовке есть признаки суммы всего аукциона')
                          if amount['multiple_amounts_in_headline']:reason.append('В заголовке несколько сумм: проверить стоимость именно лота')
                          if amount['currency']!='USD':reason.append('Требуется конвертация валюты на дату продажи; порог $300 000 ещё не проверен')
                          byid[cid]={'id':cid,'house':src['name'],'country':src['country'],'domain':src['domain'],
                                     'source_type':src['type'],'category':kind(title,src['category']),
                                     'title':title,'publication_at':iso_date(item_text(node,'pubDate')),
                                     'google_news_url':link,'publisher_website':pub_url,
                                     'native_amount':amount['amount_native'],'native_currency':amount['currency'],
                                     'raw_price':amount['amount_text'],'indicative_usd':amount['indicative_usd'],
                                     'possible_aggregate':aggregate,
                                     'status':'needs_primary_source','verified_sale':False,'review_reasons':reason}
                          accepted+=1;added+=1
                      checked.append({**stamp,'status':'ok','rss_items':len(docs),'new_leads':accepted})
                  except urllib.error.HTTPError as e:
                      checked.append({**stamp,'status':'error','http_code':e.code,'reason':str(e)[:140]})
                  except Exception as e:
                      checked.append({**stamp,'status':'error','reason':str(e)[:140]})
                  if offset<PER_RUN-1:time.sleep(2.4)
              next_cursor=(cursor+len(checked))%len(registry)
              state['cursor']=next_cursor
              state['runs']=int(state.get('runs',0))+1
              if next_cursor<=cursor:state['cycles']=int(state.get('cycles',0))+1
              state['last_run_utc']=NOW.isoformat()
              save('global_scan_state.json',state)
              ranked=sorted(byid.values(),key=lambda x:(x.get('publication_at') or '',x.get('id') or ''),reverse=True)[:CAP]
              save('global_review.json',ranked)
              status={'checked_utc':NOW.isoformat(),'registry_sources':len(registry),'auctions_and_houses':sum(x['type']=='house' for x in registry),
                      'discovery_platforms':sum(x['type']=='platform' for x in registry),
                      'regions':sorted(set(x['country'] for x in registry)),'registry_coverage':'curated, not exhaustive',
                      'batch_size':len(checked),'rss_ok':sum(x['status']=='ok' for x in checked),
                      'rss_errors':sum(x['status']!='ok' for x in checked),'new_candidates':added,
                      'candidate_queue_size':len(ranked),'verified_sales_added':0,'minimum_usd':MIN_USD,
                      'next_cursor':next_cursor,'scan_cycles_completed':state['cycles'],
                      'discovery_method':'official publisher-site filtered Google News RSS',
                      'restrictions':['No direct requests to blocked auction sites','Headlines are not proof of a sale',
                        'No automatic FX conversion or verified-sale promotion','Existing Phillips historical results are untouched'],
                      'checks':checked}
              save('global_status.json',status)
              print(json.dumps(status,ensure_ascii=False,indent=2))
              return status

          if __name__=='__main__':
              collect()
          PY
      - name: Build public global monitoring page
